<main class="dgb">
  <section class="dgb-hero dgb-dark" data-dg-nav-theme="dark">
    <div class="dgb-wrap">
      <span class="dgb-label">Blog</span>
      <h1 class="dgb-h1" style="margin-top:18px">Ιδέες &amp; <span class="dgb-grad">Νέα</span></h1>
      <p class="dgb-intro">Οδηγοί για την επιχείρησή σας, ιστορίες από τα έργα μας και νέα της ομάδας</p>
{{FEATURE}}
    </div>
  </section>

  <section class="dgb-lib" id="dgb-articles" data-dg-nav-theme="light">
    <i class="dgb-mesh dgb-mesh--l" aria-hidden="true"></i><i class="dgb-mesh dgb-mesh--r" aria-hidden="true"></i>
    <div class="dgb-wrap">
      <div class="dgb-toolbar">
        <h2 class="dgb-h2">Αρχείο <span class="dgb-grad">άρθρων</span></h2>
        <div class="dgb-filters" role="group" aria-label="Φιλτράρισμα δημοσιεύσεων">
{{FILTERS}}
        </div>
      </div>

      <div class="dgb-cards">
{{CARDS}}
      </div>
      <span class="dgb-sr" aria-live="polite" id="dgb-status"></span>
    </div>
  </section>
</main>

<script data-no-optimize="1" data-no-defer="1" data-cfasync="false">
(function () {
  var root = document.querySelector(".dgb"); if (!root) return;
  var buttons = root.querySelectorAll("[data-filter]"), cards = root.querySelectorAll("[data-kind]"), feat = root.querySelector(".dgb-feat");
  function pick(kind) {
    buttons.forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.filter === kind)); });
    if (feat) feat.hidden = kind !== "all";
    var n = 0;
    cards.forEach(function (c) {
      var show = kind === "all" ? !c.hasAttribute("data-feature-copy") : c.dataset.kind === kind;
      c.hidden = !show; if (show) n++;
    });
    document.getElementById("dgb-status").textContent = "Δημοσιεύσεις που εμφανίζονται: " + (n + (feat && !feat.hidden ? 1 : 0));
  }
  buttons.forEach(function (b) { b.addEventListener("click", function () { pick(b.dataset.filter); }); });
})();
</script>
